<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Twitch</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            flex-direction: column;
        }
        h1 {
            margin-bottom: 20px;
            color: #9146FF; /* Color de Twitch */
        }
        video {
            width: 90%; /* Ajusta el ancho del video */
            max-width: 1280px; /* Ancho máximo para pantallas grandes */
            border: 2px solid #9146FF;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.5);
            background-color: #000; /* Fondo negro para el reproductor */
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Reproductor de Stream de Twitch</h1>
    <video id="videoPlayer" controls autoplay></video>

    <div class="message">
        <p>Si el video no carga, la URL del stream podría haber expirado.</p>
        <p>Las URLs de stream de Twitch suelen ser temporales.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const video = document.getElementById('videoPlayer');
        const videoUrl = 'https://sae12.playlist.ttvnw.net/v1/playlist/CuoE0cicZQ87nRu-yb0STiBjMZvCkatPasJqcA4XnWAhntYwDHJ8ysVixl-obIebqgx4Nb8zaaBNI0gzYsGQyP9uh1weCawvNv4AgEwoU2fwR7klnadiv8XmMtlb0oBdQvE8CZWMokBvJlqroiZXbVxaHzl35SL17IDwFjx61sU01fmVVl8maicNOuRunThoU9PORLmuwrLzKpnWEv2w1BXQ68-Rj_wcQbCkrTuQR0GRdPRPrpr1FJq4Ho80rhuwK6lP3L0FejvoICv5cAKeT5beRXBXw4bLNUnnye-HEcXakWlm5k9nCMnfdi96kj9AXVDSWGw89aYchHZLtTFE8iViGQKFpG7aO7HTwEtwTRy0SHq-izlYSFgoJEH80DIFt-3_UP2NYngkiqtmlStBTf1wbna2YWcYx3mN7GSDQasXnTigf__evXQmlG0UL1oHKmdnccmhJMz-zJsT17qnPGVsF8GlR7USu4OOgUv4H0Pr7s3oqyCt9VBBdwAlJpgGyJjAily16t1lD3-7T_4dsrCqTCKSbL-TKk3IsBiDl8JAQ2emL-NjSuOw3pu_IML29dcBtk53GRbUXtziirz2Xe-v0YYY8aZMbUAqHyJRmJFevuz-gforD3yydpKiQEy5VgaM-za21cgvCWHWRZqwz5imz6lBy8ncGJC1AyirTBWd2zD_2QJNzTOg0Q0vylBpWRgo93bEPJ-9faXWLRlDwV719WCXYiT0fZFhW7ZJCBhlcFu0r54UCxx7Xv4exGoiluLthdo5zVhzvEKWA5pbmS9ISCzuwER6I-HrOeuJHu3vEh_Xfd7XXhyGyEMKGgw-Z16ZO7shLd7BKc4gASoJdXMtZWFzdC0yMMQM.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error("Fatal network error encountered, try to recover", data);
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error("Fatal media error encountered, try to recover", data);
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Soporte nativo para HLS (ej. Safari en iOS/macOS)
            video.src = videoUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        } else {
            console.error("Tu navegador no soporta HLS.");
            alert("Lo siento, tu navegador no puede reproducir este tipo de stream directamente.");
        }
    </script>
</body>
</html>
